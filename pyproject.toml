[project]
name = "mcp-client-capabilities"
version = "0.0.14"
description = "Index of all Model Context Protocol (MCP) clients and their capabilities"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Apify"}]
license = "Apache-2.0"
dependencies = [
    "fastmcp>=3.1.0",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[project.scripts]
mcp-probe = "mcp_client_capabilities.probe_server:main"


[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.9.0",
    "ty>=0.0.1a7",
]

[tool.ruff]
target-version = "py312"
line-length = 200

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "ASYNC",    # flake8-async
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "DTZ",      # flake8-datetimez (timezone-aware datetimes)
    "EM",       # flake8-errmsg
    "FURB",     # refurb (modern Python patterns)
    "ISC",      # flake8-implicit-str-concat
    "LOG",      # flake8-logging
    "N",        # pep8-naming
    "PERF",     # perflint
    "PGH",      # pygrep-hooks (no bare type: ignore, no eval)
    "PIE",      # flake8-pie
    "PL",       # pylint
    "PTH",      # flake8-use-pathlib
    "RET",      # flake8-return
    "RSE",      # flake8-raise
    "RUF",      # ruff-specific rules
    "SIM",      # flake8-simplify
    "TC",       # flake8-type-checking
    "TRY",      # tryceratops
]
ignore = [
    "PLR2004",  # magic-value-comparison — acceptable in small scripts
    "TRY003",   # long exception messages outside class — too strict here
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--tb=short", "--cov=mcp_client_capabilities", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["src/mcp_client_capabilities"]
omit = ["src/mcp_client_capabilities/example.py"]

[tool.coverage.paths]
source = ["src/mcp_client_capabilities"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 95
